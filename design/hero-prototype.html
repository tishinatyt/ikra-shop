:root{
  --ice:#E3EBEE;      /* лід: основний світлий фон */
  --frost:#F6F9FA;    /* іній: картки, поверхні */
  --deep:#0F2A32;     /* глибина: кришка, темні блоки, текст */
  --deep-2:#1B3D47;
  --roe:#E8561F;      /* ікра: єдиний теплий колір, кнопки */
  --roe-dark:#B93C10;
  --tin:#9FB2B8;      /* жесть кришки, тонкі лінії */
  --ink:#12262D;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ice);color:var(--ink);font:400 17px/1.6 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hdr{position:absolute;inset:0 0 auto 0;z-index:5;background:rgba(227,235,238,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(15,42,50,.08);display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,48px)}
.hdr img{height:40px;display:block}
.hdr nav{display:flex;gap:28px;align-items:center;font-weight:500;font-size:15px}
.hdr nav a{text-decoration:none}
.cart{display:inline-flex;align-items:center;gap:8px;background:var(--frost);border:1px solid #c9d6da;border-radius:999px;padding:9px 16px}
.cart b{background:var(--roe);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.hero{position:relative;height:min(100svh,860px);min-height:620px;overflow:hidden;background:#7a1f08}
#roe{position:absolute;inset:0;width:100%;height:100%;display:block}

.lid{position:absolute;z-index:3;left:clamp(16px,7vw,110px);top:50%;transform:translateY(-46%);
  width:min(560px,46vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:left;
  background:
    radial-gradient(circle at 50% 50%,transparent 0 63%,rgba(255,255,255,.06) 63.4% 64%,transparent 64.4% 69%,rgba(0,0,0,.25) 69.4% 70%,transparent 70.4%),
    radial-gradient(circle at 35% 28%,#2a5560 0,var(--deep) 55%,#081a1f 100%);
  box-shadow:0 0 0 10px #c3ced1,0 0 0 11px #8fa3a9,0 30px 60px -10px rgba(40,5,0,.55),inset 0 2px 0 rgba(255,255,255,.12);
  color:#EEF4F5}
.lid-in{width:68%}
h1{font:700 clamp(34px,3.6vw,54px)/1.08 "Playfair Display",Georgia,serif;margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0 0 26px;color:#C2D3D7;font-size:clamp(15px,1.15vw,17px);max-width:34ch}
.acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--roe);color:#fff;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:999px;box-shadow:0 6px 18px -6px rgba(232,86,31,.7);transition:background .2s}
.btn:hover{background:var(--roe-dark)}
.lnk{color:#C2D3D7;font-weight:500;text-underline-offset:4px}
:focus-visible{outline:3px solid #FFB25C;outline-offset:3px}
.hint{position:absolute;z-index:3;right:clamp(16px,4vw,48px);bottom:22px;color:#ffe3cf;font-size:13px;opacity:.85}
@media (max-width:760px){
  .hdr nav a:not(.cart){display:none}
  .hdr img{height:36px}
  .hero{height:auto;min-height:0;padding:100px 16px 120px}
  .lid{position:relative;left:auto;top:auto;transform:none;width:100%;max-width:460px;margin:0 auto;aspect-ratio:auto;border-radius:28px;padding:30px 24px 28px;box-shadow:0 0 0 7px #c3ced1,0 0 0 8px #8fa3a9,0 24px 40px -10px rgba(40,5,0,.6)}
  .lid-in{width:100%}
  h1{font-size:clamp(26px,7.4vw,34px);margin-bottom:12px}
  .lead{margin-bottom:18px;font-size:14.5px}
  .btn{padding:13px 22px}
  .hint{display:none}
}

<section class="hero">
  <canvas id="roe" aria-hidden="true"></canvas>
  <div class="lid"><div class="lid-in">
    <h1>Червона ікра з доставкою по Чернігову</h1>
    <p class="lead">Привеземо по місту в день замовлення. По Україні відправляємо Новою Поштою.</p>
    <div class="acts"><a class="btn" href="#">Обрати ікру</a><a class="lnk" href="#">Як ми доставляємо</a></div>
  </div></div>
</section>
<script>
(()=>{
const cv=document.getElementById('roe'),cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,dpr,grains=[],light={x:.72,y:.25},target={x:.72,y:.25},t0=performance.now(),hasPointer=false;
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function build(){
  dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const r0=W<760?15:Math.max(17,Math.min(24,W/62)),R=rnd(7);grains=[];
  const dx=r0*1.9,dy=r0*1.65;
  for(let row=-1,y=-r0;y<H+r0*2;row++,y+=dy)for(let x=(row%2?dx/2:0)-r0;x<W+r0*2;x+=dx){
    const r=r0*(.86+R()*.24);grains.push({x:x+(R()-.5)*r0*.5,y:y+(R()-.5)*r0*.5,r,e:R()*Math.PI*2,h:R()*.12,d:Math.hypot(x-W*.6,y-H*.5)});
  }
  grains.sort((a,b)=>a.y-b.y);
}
function draw(now){
  const age=reduce?1e9:now-t0;
  if(!hasPointer&&!reduce){const a=now/5200;target.x=.62+Math.cos(a)*.22;target.y=.4+Math.sin(a*1.3)*.25}
  light.x+=(target.x-light.x)*.08;light.y+=(target.y-light.y)*.08;
  cx.setTransform(dpr,0,0,dpr,0,0);
  const bg=cx.createRadialGradient(light.x*W,light.y*H,0,light.x*W,light.y*H,Math.max(W,H));
  bg.addColorStop(0,'#c2410f');bg.addColorStop(1,'#5a1405');cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  const lx=light.x*W,ly=light.y*H,maxD=Math.hypot(W,H)*.75;
  for(const g of grains){
    // one load moment: grains appear from the centre outward, like a lid lifting
    const k=Math.min(1,Math.max(0,(age-g.d*0.9)/420));if(k<=0)continue;
    const r=g.r*(.6+.4*(1-Math.pow(1-k,3)));
    const vx=lx-g.x,vy=ly-g.y,vd=Math.hypot(vx,vy)||1,ux=vx/vd,uy=vy/vd;
    const near=1-Math.min(1,vd/maxD);
    // body: translucent sphere, lit side toward the light, glow on the far side (light passing through)
    const gr=cx.createRadialGradient(g.x+ux*r*.35,g.y+uy*r*.35,r*.05,g.x,g.y,r);
    gr.addColorStop(0,`hsl(${30+g.h*40},100%,${66+near*12}%)`);
    gr.addColorStop(.55,`hsl(${18+g.h*30},90%,${47+near*8}%)`);
    gr.addColorStop(1,`hsl(${10+g.h*20},85%,${27+near*6}%)`);
    cx.globalAlpha=k;cx.fillStyle=gr;cx.beginPath();cx.arc(g.x,g.y,r,0,7);cx.fill();
    // transmitted glow opposite the light
    const tg=cx.createRadialGradient(g.x-ux*r*.42,g.y-uy*r*.42,0,g.x-ux*r*.42,g.y-uy*r*.42,r*.55);tg.addColorStop(0,`rgba(255,200,110,${.22+near*.22})`);tg.addColorStop(1,'rgba(255,200,110,0)');cx.fillStyle=tg;cx.beginPath();cx.arc(g.x,g.y,r,0,7);cx.fill();
    // the eye (embryo) inside each grain
    cx.fillStyle='rgba(120,30,6,.22)';cx.beginPath();cx.arc(g.x+Math.cos(g.e)*r*.3,g.y+Math.sin(g.e)*r*.3,r*.15,0,7);cx.fill();
    // specular highlight follows the light
    cx.save();cx.translate(g.x+ux*r*.5,g.y+uy*r*.5);cx.rotate(Math.atan2(uy,ux)+Math.PI/2);
    cx.fillStyle=`rgba(255,255,255,${.55+near*.4})`;cx.beginPath();cx.ellipse(0,0,r*.24,r*.12,0,0,7);cx.fill();cx.restore();
    cx.globalAlpha=1;
  }
  if(!reduce)requestAnimationFrame(draw);
}
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;hasPointer=true;const b=cv.getBoundingClientRect();target.x=(e.clientX-b.left)/b.width;target.y=(e.clientY-b.top)/b.height});
addEventListener('resize',()=>{build();if(reduce)draw(0)});
build();requestAnimationFrame(draw);
})();
</script>
